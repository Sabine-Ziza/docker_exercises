
services:
  app:
      image: my-express-app:latest
      ports:
        - 5000:5000
      environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_USER: sabine
        DB_PASSWORD: mypassword
        DB_NAME: myapp

  postgress:
    image: postgres:16
    environment:
      POSTGRES_USER: sabine
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myapp
    volumes:
      - express-data:/var/lib/postgresql/data




volumes: 
  express-data: